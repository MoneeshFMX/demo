name: Linux_Container_Workflow

on:
    pull_request:
      branches: 
        - dev
      types: [closed]

env:
    AZURE_REPOSITORY: "demo-version"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
        
        # Checkout the Repo
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@v2  # Ensure you're using v2 for better control over fetch options
          
        # Fetch all tags
        - name: 'Fetch all tags'
          run: git fetch --tags
        
        # Build and push the Docker image
        - run: |
            # Check if the ref is a tag or a pull request
            if [[ $GITHUB_REF == refs/tags/* ]]; then
                # It's a tag push, extract the tag name
                TAG_NAME=${GITHUB_REF#refs/tags/}  # Use tag name for push
            elif [[ $GITHUB_REF == refs/pull/* ]]; then
                # It's a pull request, extract the latest tag
                TAG_NAME=$(git describe --tags --abbrev=0)  # Get the latest tag
            fi
            echo "Using tag: $TAG_NAME"
