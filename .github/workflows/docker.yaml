name: Linux_Container_Workflow

on:
    pull_request:
      branches: 
        - dev
      types: [closed]

env:
    AZURE_REPOSITORY: "demo-version"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
        
        # Checkout the Repo
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@v2  # Ensure you're using v2 for better control over fetch options
          
        # Fetch all tags
        - name: 'Fetch all tags'
          run: git status
        
        # Build and push the Docker image
        - run: |
            git fetch --tags
            TAG_NAME=$(git describe --tags --abbrev=0)  # Get the latest tag
            echo "Using tag: $TAG_NAME"
